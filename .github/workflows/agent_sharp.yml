name: Agent Sharp Weekly

on:
  schedule:
    # Sundays at 07:00 UTC. Spaced 2h after the daily aggregator (05:00 UTC)
    # to avoid overlapping pushes to main.
    - cron: '0 7 * * 0'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Agent Sharp
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Langfuse telemetry (Phase 1: traces). Missing keys skip
          # instrumentation without affecting the run. EU cloud host
          # hardcoded here for convenience - override via a secret if
          # you ever migrate regions.
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: https://cloud.langfuse.com
          # Force line-buffered stdout so print() output flushes in
          # real time. Without this, GHA logs only show the first few
          # lines until the process exits (Python defaults to block-
          # buffering when stdout is a pipe).
          PYTHONUNBUFFERED: '1'
        run: python scripts/agent_sharp.py

      # Regenerate the RSS feed from agent/index.json + edition JSONs so
      # external automation (Zapier, Publer, Buffer) can watch it and
      # cross-post to the Sharp PM LinkedIn Page. Runs even if the agent
      # step failed - rebuilding the feed off the existing editions is
      # harmless and keeps the feed current.
      - name: Generate RSS feed
        if: always()
        run: python scripts/generate_feed.py

      - name: Commit and push edition
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403  # v5
        with:
          commit_message: "content: new Agent Sharp edition"
          file_pattern: "agent/**"
          skip_fetch: false
          push_options: '--force-with-lease'
          commit_user_name: TheSharpPM
          commit_user_email: thesharppm@gmail.com
          commit_author: TheSharpPM <thesharppm@gmail.com>
