version: 2
updates:
  # Track third-party GitHub Actions. When you pin actions to SHAs
  # (recommended), Dependabot opens PRs as upstream releases new
  # versions so the lockstep stays current without manual lookups.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python deps pinned in requirements.txt - same idea.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
